<style>
:root{--navy:#081a44;--navy2:#0d2a6b;--blue:#1a6bff;--blue-d:#0f4fd1;--sun:#ffc83d;--bg:#f3f7ff;--card:#fff;--ink:#12203f;--mute:#586a8f;--line:#dbe4f6;--ok:#0e9f6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081331;--card:#10204d;--ink:#eaf0ff;--mute:#a3b3d9;--line:#233468}}
:root[data-theme="dark"]{--bg:#081331;--card:#10204d;--ink:#eaf0ff;--mute:#a3b3d9;--line:#233468}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif}
h1,h2,h3,.brand{font-family:'Sora','Noto Sans Devanagari',system-ui,sans-serif;line-height:1.2;margin:0}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(8,26,68,.96);color:#fff;backdrop-filter:blur(8px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.brand{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:9px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--sun);color:var(--navy);display:grid;place-items:center;font-weight:800}
nav a{margin-left:20px;font-size:.92rem;opacity:.9}nav a:hover{opacity:1}
.hr{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg.lt{background:var(--line)}
.seg button{border:0;background:transparent;color:inherit;padding:6px 13px;border-radius:999px;font-weight:600;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--navy)}
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:600;background:var(--blue);color:#fff;display:inline-block}
.btn:hover{background:var(--blue-d)}
.btn.y{background:var(--sun);color:var(--navy)}.btn.y:hover{background:#ffd666}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.55)}
.btn.sm{padding:8px 14px;font-size:.88rem;border-radius:9px}
.hero{background:radial-gradient(circle at 85% 10%,#1d4bb8 0,transparent 45%),linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:54px 0 96px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px);background-size:24px 24px;mask-image:linear-gradient(90deg,transparent,#000 80%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.3fr 1fr;gap:34px;align-items:center}
.badge{display:inline-block;background:rgba(255,200,61,.16);color:var(--sun);border:1px solid rgba(255,200,61,.4);border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:600;margin-bottom:16px}
.hero h1{font-size:clamp(2.3rem,6vw,4.2rem);font-weight:800}
.hero p{max-width:50ch;color:#c9d7f7;margin:16px 0 24px;font-size:1.05rem}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.search{display:flex;gap:8px;margin-top:24px;max-width:560px;background:#fff;border-radius:14px;padding:6px}
.search input{flex:1;border:0;border-radius:10px;padding:11px 12px;font:inherit;min-width:0;background:transparent;color:#12203f}
.panel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:20px}
.panel .on{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--sun)}
.dot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,77,77,0)}0%{box-shadow:0 0 0 0 rgba(255,77,77,.7)}}
.panel h3{font-size:1.25rem;margin:10px 0 4px}.panel small{color:#c9d7f7}
.mini{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mini span{background:rgba(255,255,255,.14);border-radius:8px;padding:5px 10px;font-size:.82rem}
.tiles{margin-top:-58px;position:relative;z-index:2}
.tile-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 14px 40px rgba(8,26,68,.14)}
.tile-box h2{font-size:1.1rem;margin-bottom:12px}
.tiles-row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.tile{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 4px;text-align:center;font-weight:700}
.tile b{display:block;font:800 1.7rem 'Sora'}.tile span{font-size:.75rem;color:var(--mute);font-weight:500}
.tile[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}.tile[aria-pressed="true"] span{color:#d8e6ff}
section{padding:46px 0}
h2{font-size:1.7rem;margin-bottom:6px}.sub{color:var(--mute);margin:0 0 20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
select{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(135deg,hsl(var(--h) 80% 48%),hsl(calc(var(--h) + 30) 80% 38%));color:#fff}
.top .e{font-size:2rem}.pill{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.body h3{font-size:1rem}.tag{font-size:.84rem;color:var(--mute)}
.price{font:800 1.1rem 'Sora'}.price s{color:var(--mute);font-weight:500;margin-left:6px;font-size:.82rem}.free{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.live{display:flex;gap:12px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.date{min-width:58px;text-align:center;background:var(--navy);color:#fff;border-radius:12px;padding:7px}.date b{display:block;font:800 1.25rem 'Sora'}
.alt{background:var(--card)}
.stats{background:var(--navy);color:#fff;border-radius:22px;padding:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;text-align:center}
.stats b{font:800 2rem 'Sora';color:var(--sun)}.stats div{color:#c9d7f7;font-size:.9rem}
.tc{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.av{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.who{display:flex;gap:12px;align-items:center;margin-top:12px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:9px}summary{font-weight:600;cursor:pointer}
.empty{border:2px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--mute)}
.notice{background:#fff4d6;color:#5a4300;border-radius:12px;padding:12px 14px;font-size:.9rem}
footer{background:var(--navy);color:#c9d7f7;padding:32px 0;font-size:.92rem}
dialog{border:0;border-radius:18px;padding:22px;max-width:480px;width:calc(100% - 28px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,12,35,.6)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:50;display:none;max-width:90%}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.panel{display:none}nav{display:none}.tiles-row{grid-template-columns:repeat(4,1fr)}.hero{padding-bottom:84px}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}html{scroll-behavior:auto}}
.card,.f,.tcard{transition:transform .2s,box-shadow .2s}.card:hover,.f:hover,.tcard:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(8,26,68,.16)}
.floaters i{position:absolute;font-style:normal;font-size:1.9rem;width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center}
.floaters i:nth-child(1){right:2%;top:-18px;transform:rotate(-8deg)}.floaters i:nth-child(2){right:42%;bottom:-34px;transform:rotate(6deg)}.floaters i:nth-child(3){right:-1%;bottom:-20px;transform:rotate(10deg)}.floaters i:nth-child(4){right:34%;top:-24px;transform:rotate(-4deg)}
.offer{background:linear-gradient(120deg,var(--blue),var(--navy2));color:#fff;border-radius:24px;padding:28px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.offer:after{content:"%";position:absolute;right:130px;top:-60px;font:800 12rem 'Sora';color:rgba(255,255,255,.09);pointer-events:none}
.offer>*{position:relative;z-index:1}.offer h2{font-size:1.5rem}
.code{background:var(--sun);color:var(--navy);border-radius:10px;padding:9px 16px;font:700 1rem 'Sora';border:2px dashed var(--navy)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.f{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.fi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(135deg,var(--blue),var(--navy2));margin-bottom:12px}
.tcard{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 14px}
.tav{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font:800 1.9rem 'Sora';color:#fff;background:linear-gradient(135deg,var(--blue),var(--navy2));box-shadow:0 0 0 4px var(--sun)}
.pal{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:var(--sun);font-size:1.35rem;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.pop{display:none;position:absolute;right:0;bottom:60px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;flex-direction:column;gap:8px;min-width:180px;box-shadow:0 14px 34px rgba(0,0,0,.2)}.pop.open{display:flex}
.sw{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;text-align:left}.sw i{width:20px;height:20px;border-radius:50%;flex:none}

</head>

const SUB={"Mathematics":["गणित","📐",220],"Science":["विज्ञान","🔬",150],"Hindi":["हिंदी","📖",15],"English":["अंग्रेज़ी","🔤",265],"Social Science":["सामाजिक विज्ञान","🌏",35],"Computer Science":["कंप्यूटर विज्ञान","💻",195],"Physics":["भौतिकी","⚛️",240],"Chemistry":["रसायन विज्ञान","🧪",170],"Biology":["जीव विज्ञान","🧬",120],"PCM Program":["PCM प्रोग्राम","🎯",20]};
const LOW=["Mathematics","Science","Hindi","English","Social Science","Computer Science"],HIGH=["Physics","Chemistry","Mathematics","Biology","English","Hindi","PCM Program"];
const TEA=[["R. K. Gupta","आर. के. गुप्ता"],["Anita Sharma","अनीता शर्मा"],["Vikram Singh","विक्रम सिंह"],["Pooja Verma","पूजा वर्मा"],["Sanjay Mishra","संजय मिश्रा"],["Neha Kapoor","नेहा कपूर"]];
const VO={en:[["Rahul, Class 10","Hindi-medium science finally made sense. The doubt chat is quick."],["Mrs. Sinha, parent","My daughter tracks her own progress. The weekly tests help a lot."],["Aditi, Class 12","PCM notes and mock tests kept my revision on schedule."]],
hi:[["राहुल, कक्षा 10","हिंदी में विज्ञान आख़िरकार समझ आया। डाउट चैट में जवाब जल्दी मिलता है।"],["श्रीमती सिन्हा, अभिभावक","मेरी बेटी अपनी प्रगति ख़ुद देखती है। साप्ताहिक टेस्ट बहुत काम आते हैं।"],["अदिति, कक्षा 12","PCM के नोट्स और मॉक टेस्ट से मेरी रिवीज़न समय पर पूरी हुई।"]]};
const FAQ={en:[["Which classes and boards are covered?","Classes 6 to 12 on the CBSE syllabus, in Hindi and English medium."],["How do I pay for a course?","Checkout will use Razorpay. Access unlocks only after the payment is verified on the server."],["Can I watch a missed live class?","Yes. When the video provider saves recordings, they appear in the course."],["Is my child’s information safe?","Student details stay private, and parental consent is collected for minors."]],
hi:[["कौन-सी कक्षाएँ और बोर्ड हैं?","कक्षा 6 से 12, CBSE सिलेबस, हिंदी और अंग्रेज़ी दोनों माध्यम में।"],["कोर्स का पेमेंट कैसे करें?","चेकआउट Razorpay से होगा। पेमेंट सर्वर पर वेरिफ़ाई होने के बाद ही कोर्स खुलेगा।"],["छूटी हुई लाइव क्लास देख सकते हैं?","हाँ। वीडियो प्रोवाइडर रिकॉर्डिंग सेव करे तो वह कोर्स में दिखेगी।"],["क्या मेरे बच्चे की जानकारी सुरक्षित है?","छात्रों की जानकारी निजी रहती है और नाबालिगों के लिए अभिभावक की सहमति ली जाती है।"]]};
const FE=[["🎥","Live + recorded classes","लाइव + रिकॉर्डेड क्लास","Join live, or watch later at your own pace.","लाइव जुड़ें या अपनी रफ़्तार से बाद में देखें।"],["📝","Tests and quizzes","टेस्ट और क्विज़","Chapter tests with instant scores and explanations.","अध्याय के टेस्ट, तुरंत स्कोर और व्याख्या के साथ।"],["🗣️","Hindi and English medium","हिंदी और अंग्रेज़ी माध्यम","The same CBSE syllabus in the language you study in.","वही CBSE सिलेबस, आपकी अपनी भाषा में।"],["🏅","Progress and certificates","प्रगति और सर्टिफ़िकेट","See completed chapters and earn a certificate.","पूरे किए अध्याय देखें और सर्टिफ़िकेट पाएँ।"]];
const THEMES=[["Royal Blue","रॉयल ब्लू","#081a44","#0d2a6b","#1a6bff","#0f4fd1","#ffc83d"],["Emerald","पन्ना हरा","#06302a","#0b5a49","#12a672","#0d8a5e","#ffd25e"],["Violet","बैंगनी","#1b1040","#32207a","#7c4dff","#5f34e0","#ffb84d"],["Sunset","सनसेट","#2b1203","#5a2a0a","#f26a1b","#cf5410","#ffd25e"]];
const CL=[6,7,8,9,10,11,12],COURSES=[];let n=1;
CL.forEach(c=>(c<=10?LOW:HIGH).forEach((s,i)=>["hi","en"].forEach(m=>{
  const free=(c<=10&&i===3)||(c>10&&i===4),base=s==="PCM Program"?7999:c>=11?3999:c>=9?2499:1499;n++;
  COURSES.push({id:COURSES.length+1,cls:c,subj:s,med:m,teacher:TEA[(n+i)%6],lessons:24+(n*7)%30,price:free?0:base,mrp:free?0:Math.round(base*1.4/100)*100,rating:(4.3+(n*3)%7/10).toFixed(1),pop:(n*37)%100});
})));
let S={lang:"hi",cls:10,q:"",subj:"",price:"",sort:"pop",mine:{}};
try{const v=localStorage.getItem("rkg-mine");if(v)S.mine=JSON.parse(v)||{};const l=localStorage.getItem("rkg-lang");if(l)S.lang=l}catch(e){}
const $=s=>document.querySelector(s),t=k=>L[S.lang][k],hi=()=>S.lang==="hi";
const inr=x=>"₹"+x.toLocaleString("en-IN"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{try{localStorage.setItem("rkg-mine",JSON.stringify(S.mine));localStorage.setItem("rkg-lang",S.lang)}catch(e){}};
const toast=m=>{const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",3300)};
const sn=s=>hi()?SUB[s][0]:s,cn=c=>hi()?"कक्षा "+c:"Class "+c,tn=c=>c.teacher[hi()?1:0];
const title=c=>hi()?`कक्षा ${c.cls} ${sn(c.subj)}${c.subj==="PCM Program"?"":" — पूरा कोर्स"}`:`Class ${c.cls} ${c.subj}${c.subj==="PCM Program"?"":" — Complete Course"}`;
function card(c){return `<article class="card"><div class="top" style="--h:${SUB[c.subj][2]}"><span class="e" aria-hidden="true">${SUB[c.subj][1]}</span><span class="pill">${L[S.lang].med[c.med]}</span></div>
<div class="body"><h3>${esc(title(c))}</h3><div class="tag">${esc(tn(c))} · ${c.lessons} ${t("lessons")} · ★ ${c.rating} · CBSE</div>
<div class="row"><span class="price ${c.price?"":"free"}">${c.price?inr(c.price)+"<s>"+inr(c.mrp)+"</s>":t("free")}</span><button class="btn sm" data-open="${c.id}">${S.mine[c.id]!==undefined?t("open"):t("view")}</button></div></div></article>`}
function ui(){
  document.documentElement.lang=hi()?"hi":"en";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $("#q").placeholder=t("ph");
  $("#brandName").textContent=BRAND;$("#brandName2").textContent=BRAND;document.title=BRAND;
  document.querySelectorAll(".medseg").forEach(g=>g.innerHTML=`<button aria-pressed="${hi()}" data-lang="hi">हिंदी</button><button aria-pressed="${!hi()}" data-lang="en">English</button>`);
  $("#tiles").innerHTML=CL.map(c=>`<button class="tile" aria-pressed="${c===S.cls}" data-c="${c}"><b>${c}</b><span>${hi()?"कक्षा":"Class"}</span></button>`).join("");
  const subs=S.cls<=10?LOW:HIGH;
  $("#subj").innerHTML=`<option value="">${t("allSub")}</option>`+subs.map(s=>`<option value="${s}" ${s===S.subj?"selected":""}>${sn(s)}</option>`).join("");
  $("#price").innerHTML=`<option value="">${t("anyP")}</option><option value="free" ${S.price==="free"?"selected":""}>${t("free")}</option><option value="paid" ${S.price==="paid"?"selected":""}>${t("paid")}</option>`;
  $("#sort").innerHTML=[["pop","sPop"],["rate","sRate"],["low","sLow"]].map(o=>`<option value="${o[0]}" ${S.sort===o[0]?"selected":""}>${t(o[1])}</option>`).join("");
  $("#stats").innerHTML=["25,000+","120+","1,800+","4.7/5"].map((v,i)=>`<div><b>${v}</b><div>${t("st")[i]}</div></div>`).join("");
  $("#voices").innerHTML=VO[S.lang].map(v=>`<div class="tc"><p style="margin:0">“${esc(v[1])}”</p><div class="who"><span class="av">${esc(v[0][0])}</span><b>${esc(v[0])}</b></div></div>`).join("");
  $("#faqList").innerHTML=FAQ[S.lang].map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("");
  $("#why").innerHTML=FE.map(f=>`<div class="f"><div class="fi">${f[0]}</div><h3>${hi()?f[2]:f[1]}</h3><p class="tag" style="font-size:.92rem">${hi()?f[4]:f[3]}</p></div>`).join("");
  $("#teach").innerHTML=TEA.map((x,i)=>{const s=["Mathematics","Science","Physics","Chemistry","Hindi","English"][i];return `<div class="tcard"><div class="tav">${x[hi()?1:0][0]}</div><b>${x[hi()?1:0]}</b><div class="tag">${sn(s)} · ${8+i*2} ${hi()?"वर्ष अनुभव":"yrs experience"}</div><div class="tag">★ 4.${9-(i%3)}</div></div>`}).join("");
  $("#pop").innerHTML=`<b>${t("theme")}</b>`+THEMES.map((x,i)=>`<button class="sw" data-th="${i}"><i style="background:linear-gradient(135deg,${x[4]},${x[2]})"></i>${hi()?x[1]:x[0]}</button>`).join("");
  const d=new Date();
  $("#liveGrid").innerHTML=[10,11,12].map((c,i)=>{const x=new Date(d.getTime()+(i+1)*864e5),s=["Science","Physics","Mathematics"][i];
    return `<div class="live"><div class="date"><b>${x.getDate()}</b>${x.toLocaleString(hi()?"hi-IN":"en-IN",{month:"short"})}</div><div style="flex:1"><b>${cn(c)} ${sn(s)}</b><div class="tag">${["5:00 PM","6:30 PM","4:00 PM"][i]} · ${TEA[i][hi()?1:0]} · ${L[S.lang].med[i===1?"en":"hi"]}</div></div><button class="btn sm" data-live="1">${t("join")}</button></div>`}).join("");
  list();mine();
}
function list(){
  const q=S.q.toLowerCase();let l=COURSES.filter(c=>q?(`${cn(c.cls)} ${c.cls} ${c.subj} ${sn(c.subj)} ${tn(c)}`).toLowerCase().includes(q):c.cls===S.cls);
  l=l.filter(c=>c.med===S.lang);
  if(S.subj)l=l.filter(c=>c.subj===S.subj);if(S.price==="free")l=l.filter(c=>!c.price);if(S.price==="paid")l=l.filter(c=>c.price);
  l.sort((a,b)=>S.sort==="low"?a.price-b.price:S.sort==="rate"?b.rating-a.rating:b.pop-a.pop);
  $("#courseGrid").innerHTML=l.length?l.map(card).join(""):`<div class="empty">${t("none")}</div>`;
}
function mine(){
  const ids=Object.keys(S.mine);
  $("#myGrid").innerHTML=ids.length?'<div class="grid">'+ids.map(i=>{const c=COURSES[i-1],p=Math.round(S.mine[i]/c.lessons*100);
  return `<article class="card"><div class="body"><h3>${esc(title(c))}</h3><div class="tag">${L[S.lang].med[c.med]} · ${S.mine[i]} ${t("of")} ${c.lessons} ${t("doneL")} · ${p}%</div><div class="bar"><i style="width:${p}%"></i></div><div class="row"><span></span><button class="btn sm" data-open="${c.id}">${t("cont")}</button></div></div></article>`}).join("")+"</div>":`<div class="empty">${t("noMine")}</div>`;
}
function openC(i){
  const c=COURSES[i-1],has=S.mine[i]!==undefined;
  $("#dlgBody").innerHTML=`<h3>${esc(title(c))}</h3><p class="tag">${esc(tn(c))} · ${c.lessons} ${t("lessons")} · ★ ${c.rating} · CBSE · ${L[S.lang].med[c.med]}</p><p>${t("desc")}</p>`+
  (has?`<p><b>${S.mine[i]}/${c.lessons}</b> ${t("doneL")}</p><div class="bar"><i style="width:${Math.round(S.mine[i]/c.lessons*100)}%"></i></div>`:`<p class="price">${c.price?inr(c.price):t("free")}</p>`)+(!has&&c.price?`<div class="notice">${t("payNo")}</div>`:"");
  $("#dlgAct").innerHTML=has?`<button class="btn sm" data-done="${i}">${t("done")}</button>`:c.price?`<button class="btn sm" data-buy="1">${t("buy")}</button>`:`<button class="btn sm" data-enrol="${i}">${t("enrol")}</button>`;
  $("#dlg").showModal();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.lang){S.lang=d.lang;save();ui()}
  else if(d.c){S.cls=+d.c;S.q="";S.subj="";ui();$("#courses").scrollIntoView()}
  else if(d.open)openC(+d.open);
  else if(d.enrol){S.mine[d.enrol]=0;save();mine();list();openC(+d.enrol);toast(t("tEn"))}
  else if(d.done){const c=COURSES[d.done-1];if(S.mine[d.done]<c.lessons)S.mine[d.done]++;save();mine();openC(+d.done);toast(t("tDone"))}
  else if(d.buy)toast(t("tBuy"));else if(d.live)toast(t("tLive"));
  else if(b.id==="dlgClose")$("#dlg").close();else if(b.id==="loginBtn")toast(t("tLogin"));
});
function applyTheme(k){const x=THEMES[k]||THEMES[0],r=document.documentElement.style;["--navy","--navy2","--blue","--blue-d","--sun"].forEach((p,i)=>r.setProperty(p,x[i+2]));try{localStorage.setItem("rkg-theme",k)}catch(e){}}
try{const k=localStorage.getItem("rkg-theme");if(k)applyTheme(+k)}catch(e){}
document.addEventListener("click",e=>{const b=e.target.closest("[data-th]");if(b){applyTheme(+b.dataset.th);return}if(e.target.closest("#fab"))$("#pop").classList.toggle("open")});
$("#subj").onchange=e=>{S.subj=e.target.value;list()};$("#price").onchange=e=>{S.price=e.target.value;list()};$("#sort").onchange=e=>{S.sort=e.target.value;list()};
$("#heroSearch").onsubmit=e=>{e.preventDefault();S.q=$("#q").value.trim();list();$("#courses").scrollIntoView()};
ui();
</script>
</body>
</html>
